<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email confirmed — SBA Outreach Assistant</title>
<style>
  :root{
    --ink:#132420; --route:#0f6b5c; --route-deep:#0b524a;
    --waypoint:#b8720e; --paper:#f1f3ee; --card:#fdfdfb; --line:#dde3da; --muted:#68766e;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(165deg,#13294b,#0b1b33 75%);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:24px}
  .card{background:var(--card);border-radius:8px;max-width:420px;width:100%;padding:36px 32px;
    text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
  .check{width:56px;height:56px;border-radius:50%;background:#eafbf3;display:flex;align-items:center;
    justify-content:center;margin:0 auto 18px}
  h1{font-size:22px;margin:0 0 8px;color:var(--ink);font-weight:700}
  p{color:var(--muted);font-size:14.5px;line-height:1.5;margin:0 0 22px}
  .steps{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:6px;
    padding:16px 18px;margin-bottom:8px;font-size:13.5px;color:var(--ink)}
  .steps li{margin-bottom:8px}
  .steps li:last-child{margin-bottom:0}
  .small{font-size:12px;color:var(--muted);margin-top:18px}
</style>
</head>
<body>
  <div class="card">
    <div class="check">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#3f7a4e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h1>Your email is confirmed</h1>
    <p>You're all set. Head back to the SBA Outreach Assistant extension to sign in.</p>
    <ol class="steps">
      <li>Close this tab</li>
      <li>Click the SBA Outreach Assistant icon in your Chrome toolbar</li>
      <li>Sign in with the email and password you just created</li>
    </ol>
    <div class="small">You can close this page now.</div>
  </div>
</body>
</html>
